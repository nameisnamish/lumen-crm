<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Rich Vibrant Blue Gradient -->
    <linearGradient id="solidBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#082f49" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Solid Rich Blue Squircle Canvas -->
  <rect width="64" height="64" rx="16" fill="url(#solidBlue)" filter="url(#shadow)" />

  <!-- Stylized Lumen "L" in Pure White -->
