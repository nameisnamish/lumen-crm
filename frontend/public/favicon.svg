<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Exact Lumen CRM 135-degree Blue Brand Gradient (Sky Blue #38bdf8 to Ocean Blue #0284c7) -->
    <linearGradient id="lumenBrandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="45%" stopColor="#0ea5e9" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Circular Badge with 135deg Blue Brand Gradient -->
  <circle cx="32" cy="32" r="32" fill="url(#lumenBrandGradient)" />

  <!-- Main 4-Point Luminous Star (Smooth White Outline matching in-app logo) -->
  <path
    d="M32 15 C32 24.5 24.5 32 15 32 C24.5 32 32 39.5 32 49 C32 39.5 39.5 32 49 32 C39.5 32 32 24.5 32 15 Z"
    stroke="#ffffff"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top-Right Sparkle Plus -->
  <path
    d="M48 16 V24 M44 20 H52"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Bottom-Left Sparkle Dot -->
  <circle cx="18" cy="46" r="2.5" fill="#ffffff" />
</svg>