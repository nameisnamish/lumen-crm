    d="M19 15 C19 13.343 20.343 12 22 12 C23.657 12 25 13.343 25 15 V40 C25 41.105 25.895 42 27 42 H44 C45.657 42 47 43.343 47 45 C47 46.657 45.657 48 44 48 H23 C20.791 48 19 46.209 19 44 Z"
    fill="#ffffff"
  />

  <!-- Brilliant White AI Sparkle -->
  <path
    d="M45 13 C45 18.5 48.5 22 54 22 C48.5 22 45 25.5 45 31 C45 25.5 41.5 22 36 22 C41.5 22 45 18.5 45 13 Z"
    fill="#ffffff"
