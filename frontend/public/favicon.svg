<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deep Blue Outer Base (No url defs so Chrome/Edge tab rasterizer NEVER fails to black) -->
  <circle cx="32" cy="32" r="32" fill="#0284c7" />

  <!-- Bright Sky-Blue Inner Luminous Circle for authentic gradient look -->
  <circle cx="28" cy="28" r="28" fill="#38bdf8" />
  <circle cx="32" cy="32" r="29" fill="#0ea5e9" fill-opacity="0.85" />

  <!-- Central 4-Point Luminous Star -->
  <path
    d="M32 15 C32 24.5 24.5 32 15 32 C24.5 32 32 39.5 32 49 C32 39.5 39.5 32 49 32 C39.5 32 32 24.5 32 15 Z"
    stroke="#ffffff"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Top-Right Sparkle Plus -->
  <path
    d="M48 16 V24 M44 20 H52"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Bottom-Left Sparkle Dot -->
  <circle cx="18" cy="46" r="2.5" fill="#ffffff" />
</svg>